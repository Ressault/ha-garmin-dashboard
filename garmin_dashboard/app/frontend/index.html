<!doctype html>
<html lang="fr" class="dark">
  <!-- le thème choisi est appliqué par src/lib/theme.tsx ; "dark" évite un flash blanc avant le chargement -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Garmin" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Garmin Dashboard</title>
  </head>
  <body>
    <script>try{if(localStorage.getItem("theme")==="light")document.documentElement.classList.remove("dark")}catch(e){}</script>
    <div id="root">
      <!-- écran affiché dès que le HTML arrive, avant le chargement du JavaScript -->
      <div style="display:flex;min-height:100vh;align-items:center;justify-content:center;background:#000">
        <svg viewBox="0 0 64 64" width="56" height="56" aria-label="Chargement">
          <circle cx="32" cy="32" r="19" fill="none" stroke="#2C2C2E" stroke-width="7" />
          <path d="M32 13a19 19 0 1 1-17.6 11.8" fill="none" stroke="#FF375F" stroke-width="7" stroke-linecap="round" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
