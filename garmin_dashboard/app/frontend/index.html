<!doctype html>
<html lang="fr" class="dark">
  <!-- le thème choisi est appliqué par src/lib/theme.tsx ; "dark" évite un flash blanc avant le chargement -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Garmin" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Garmin Dashboard</title>
  </head>
  <body>
    <script>try{if(localStorage.getItem("theme")==="light")document.documentElement.classList.remove("dark")}catch(e){}</script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
