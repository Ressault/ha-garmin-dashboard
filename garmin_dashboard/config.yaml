name: Garmin Dashboard
version: "1.1.31"
slug: garmin_dashboard
description: Suivi sportif et santé Garmin (remplace Strava Premium), accessible 24 h/24
url: https://github.com/Ressault/ha-garmin-dashboard
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
watchdog: http://[HOST]:[PORT:8000]/api/health
ports:
  8000/tcp: 8000
ports_description:
  8000/tcp: Interface web (à ouvrir via Tailscale, voir DOCS)
webui: http://[HOST]:[PORT:8000]/
options:
  garmin_email: ""
  garmin_password: ""
  garmin_tokens: ""
  initial_sync_days: 365
schema:
  garmin_email: str?
  garmin_password: password?
  garmin_tokens: str?
  initial_sync_days: int(30,1500)
